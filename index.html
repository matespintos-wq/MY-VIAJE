<body>
<header><div class="perfilesHeader" id="perfilesHeader"></div>🌍 ORGANIZADOR DE VIAJE</header>

<div class="sidebar">
    <b>PERFILES</b>
    <div>
        <button class="btnMas" onclick="crearPerfil()">+</button>
        <button class="btnMenos" onclick="borrarPerfil()">-</button>
    </div>
    <div id="listaPerfiles" style="margin-top:10px;"></div>
    <input id="buscador" placeholder="Buscar archivo..." onkeyup="buscarArchivo()">

        <div class="grupoConversor">
            <label>USD a Cambiar</label>
            <input type="number" id="usdInput" class="inputCotiz" value="100" oninput="calcularMoneda()">
            <label>Precio Euro (USD)</label>
            <input type="number" id="euroPrecioUsd" class="inputCotiz" value="1.08" step="0.01" oninput="calcularMoneda()">
            <div class="resultadoCotiz">Recibes: <span id="resEurUsd">0.00</span> €</div>
        </div>
        <hr style="border:0; border-top:1px solid #eee; margin: 8px 0;">
        <div class="grupoConversor">
            <label>Pesos (UYU) a Cambiar</label>
            <input type="number" id="uyuInput" class="inputCotiz" value="1000" oninput="calcularMoneda()">
            <label>Precio Euro (UYU)</label>
            <input type="number" id="euroPrecioUyu" class="inputCotiz" value="43.50" step="0.10" oninput="calcularMoneda()">
            <div class="resultadoCotiz">Recibes: <span id="resEurUyu">0.00</span> €</div>
        </div>
        <hr style="border:0; border-top:1px solid #eee; margin: 8px 0;">
        <div class="grupoConversor">
            <label>Euros (EUR) a Gastar</label>
            <input type="number" id="eurGastoInput" class="inputCotiz" value="10" oninput="calcularMoneda()">
            <label>Precio Euro (UYU)</label>
            <input type="number" id="euroPrecioUyuRef" class="inputCotiz" value="43.50" oninput="calcularMoneda()">
            <div class="resultadoCotiz" style="color:#2980b9; background:#eef4ff; border-color:#d0e1f9;">
                Equivale a: $ <span id="resUyuEur">0.00</span>
            </div>
        </div>
    </div>
    
    <button class="btnBackup" onclick="descargarRespaldo()">💾 EXPORTAR RESPALDO</button>
</div>

<div class="main" id="contenido"></div>

<script>
// Tu lógica original intacta
let perfiles = JSON.parse(localStorage.getItem("perfiles") || "[]");
let perfilActual = 0;

function guardar() { localStorage.setItem("perfiles", JSON.stringify(perfiles)); }

function calcularMoneda() {
    let usd = parseFloat(document.getElementById('usdInput').value) || 0;
    let pUsd = parseFloat(document.getElementById('euroPrecioUsd').value) || 0;
    document.getElementById('resEurUsd').innerText = pUsd > 0 ? (usd / pUsd).toFixed(2) : "0.00";

    let uyu = parseFloat(document.getElementById('uyuInput').value) || 0;
    let pUyu = parseFloat(document.getElementById('euroPrecioUyu').value) || 0;
    document.getElementById('resEurUyu').innerText = pUyu > 0 ? (uyu / pUyu).toFixed(2) : "0.00";

    let eurG = parseFloat(document.getElementById('eurGastoInput').value) || 0;
    let pUyuRef = parseFloat(document.getElementById('euroPrecioUyuRef').value) || 0;
    document.getElementById('resUyuEur').innerText = (eurG * pUyuRef).toFixed(2);
}

function manejarArchivo(input, claseEnlace) {
    if (input.files && input.files[0]) {
        let fileUrl = URL.createObjectURL(input.files[0]);

            let fila = input.closest('.lineaViaje, .lineaHotel');
            let contenedor = fila.querySelector('.contenedor-pdf-tkt');
            contenedor.querySelector('.pdf-link').href = fileUrl;
            contenedor.style.display = 'flex';
        } else if(claseEnlace === 'pdfInfo') {
            let fila = input.closest('.lineaViaje, .lineaHotel');
            let linkInfo = fila.querySelector('.pdf-link-info');
            linkInfo.href = fileUrl;
            linkInfo.style.display = 'inline-block';
        } else if(claseEnlace === 'pdfDatos') {
            let fila = input.closest('.fila-datos');
            let linkDatos = fila.querySelector('.pdf-perfil');
            linkDatos.href = fileUrl;
            linkDatos.style.display = 'inline-block';
        }
    }
}
