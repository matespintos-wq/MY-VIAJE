<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador Estratégico v6.0</title>
    <style>
        :root { --p: #1a2a6c; --s: #2c3e50; --ok: #27ae60; --no: #c0392b; --ac: #3498db; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: #f4f7f9; overflow: hidden; }
        
        header { position: fixed; top: 0; width: 100%; height: 60px; background: var(--p); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; z-index: 1000; }
        
        /* SIDEBAR REESTRUCTURADA */
        .sidebar { width: 320px; min-width: 320px; background: #fff; padding: 75px 15px 20px 15px; border-right: 1px solid #d1d9e6; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .btn { padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; border: none; transition: 0.3s; }
        .btnMas { background: var(--ok); color: white; width: 100%; }
        
        /* SECCIÓN DOCUMENTOS EN SIDEBAR */
        .docSidebar { background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 12px; }
        .docFila { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
        .docFila input[type="text"] { padding: 5px; border: 1px solid #cbd5e0; border-radius: 4px; }
        .pdfLink { color: var(--no); font-weight: bold; text-decoration: none; margin-bottom: 5px; display: inline-block; }

        /* CONVERSOR MEJORADO */
        .panelCotiz { border-radius: 10px; border: 1px solid #e2e8f0; background: #fff; overflow: hidden; }
        .cotizHead { background: var(--s); color: white; padding: 10px; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; }
        .cotizBody { padding: 12px; display: none; }
        .resCotiz { margin-top: 8px; font-size: 14px; font-weight: bold; color: var(--ok); background: #f0fdf4; padding: 8px; border-radius: 6px; text-align: center; border: 1px solid #bbf7d0; }

        .main { flex: 1; margin-top: 60px; padding: 20px; overflow-y: auto; }
        .paisCard { margin-bottom: 15px; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .paisHead { padding: 15px; color: white; font-weight: bold; cursor: pointer; }
        .esp { background: #d63031; } .ita { background: #27ae60; } .sui { background: #c0392b; } .fra { background: #0984e3; }
        .paisBody { display: none; background: white; padding: 15px; }
    </style>
</head>
<body>

<header>PLANIFICADOR ESTRATÉGICO</header>

<div class="sidebar">
    <button class="btn btnMas" onclick="crearP()">+ NUEVO PERFIL</button>
    <div id="listaP"></div>

    <div id="areaDocs" class="docSidebar" style="display:none;">
        <b style="color:var(--p)">📄 DOCUMENTACIÓN</b>
        <div id="docsContent"></div>
        <button class="btn btnMas" style="margin-top:10px; font-size:11px;" onclick="saveT()">💾 GUARDAR DOCS</button>
    </div>

    <input id="buscador" placeholder="🔍 Buscar..." onkeyup="busqueda()" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc;">

    <div class="panelCotiz">
        <div class="cotizHead" onclick="toggleC()"><span>💱 DIVISAS</span> <span id="icC">▼</span></div>
        <div class="cotizBody" id="cotB">
            <div style="margin-bottom:10px;">
                <label style="font-size:10px;">EURO A PESOS (UYU)</label>
                <input type="number" id="eurIn" value="1" class="btn" style="width:90%; color:black;" oninput="calcM()">
                <label style="font-size:10px; display:block; margin-top:5px;">VALOR 1€ EN UYU</label>
                <input type="number" id="valEY" value="44.20" class="btn" style="width:90%; color:black;" oninput="calcM()">
                <div class="resCotiz">= <span id="resEY">0.00</span> UYU</div>
            </div>
            <div style="border-top:1px solid #eee; padding-top:10px;">
                <label style="font-size:10px;">USD A EURO</label>
                <input type="number" id="uIn" value="100" class="btn" style="width:90%; color:black;" oninput="calcM()">
                <div class="resCotiz">= <span id="oEU">0.00</span> €</div>
            </div>
        </div>
    </div>
</div>

<div class="main" id="view"></div>

<script>
    let DATA = JSON.parse(localStorage.getItem("viaje_v6") || "[]");
    let pIdx = 0;

    function save() { localStorage.setItem("viaje_v6", JSON.stringify(DATA)); }

    function crearP() {
        let n = prompt("Nombre:"); if(!n) return;
        DATA.push({ nombre: n, txt: {ci:"", pas:"", otr:""}, docs: {}, paises: {esp:[], ita:[], sui:[], fra:[]} });
        pIdx = DATA.length - 1; save(); renderSide(); renderAll();
    }

    function renderSide() {
        let l = document.getElementById("listaP");
        l.innerHTML = "";
        DATA.forEach((p, i) => {
            let d = document.createElement("div");
            d.style = `padding:10px; cursor:pointer; border-radius:8px; margin-bottom:5px; border:1px solid ${i===pIdx? 'var(--p)':'#eee'}; background:${i===pIdx?'#eef2ff':'#fff'}`;
            d.onclick = () => { pIdx = i; renderSide(); renderAll(); };
            d.innerHTML = `<b>👤 ${p.nombre}</b>`;
            l.appendChild(d);
        });
        renderDocs();
    }

    function renderDocs() {
        let area = document.getElementById("areaDocs");
        let cont = document.getElementById("docsContent");
        if(DATA[pIdx]) {
            area.style.display = "block";
            let p = DATA[pIdx];
            cont.innerHTML = `
                ${fDoc("Cédula", "ci", p)}
                ${fDoc("Pasaporte", "pas", p)}
                ${fDoc("Seguro", "otr", p)}
            `;
        }
    }

    function fDoc(l, k, p) {
        return `
            <div class="docFila">
                <span>${l}:</span>
                <input type="text" id="in_${k}" value="${p.txt[k]}">
                ${p.docs[k] ? `<a href="${p.docs[k]}" target="_blank" class="pdfLink">👁 Ver Archivo</a>` : ''}
                <input type="file" style="font-size:9px;" onchange="upD(this, '${k}')">
            </div>
        `;
    }

    function upD(input, k) {
        if (input.files[0]) {
            let r = new FileReader();
            r.onload = (e) => { DATA[pIdx].docs[k] = e.target.result; save(); renderSide(); };
            r.readAsDataURL(input.files[0]);
        }
    }

    function saveT() {
        DATA[pIdx].txt.ci = document.getElementById("in_ci").value;
        DATA[pIdx].txt.pas = document.getElementById("in_pas").value;
        DATA[pIdx].txt.otr = document.getElementById("in_otr").value;
        save(); alert("¡Guardado en el perfil!");
    }

    function renderAll() {
        let v = document.getElementById("view");
        if(!DATA[pIdx]) { v.innerHTML = "<h2>Crea un perfil</h2>"; return; }
        v.innerHTML = `
            ${sec("🇪🇸 ESPAÑA", "esp")} ${sec("🇮🇹 ITALIA", "ita")}
            ${sec("🇨🇭 SUIZA", "sui")} ${sec("🇫🇷 FRANCIA", "fra")}
        `;
        calcM();
    }

    function sec(n, id) {
        return `<div class="paisCard"><div class="paisHead ${id}" onclick="fld(this)">${n}</div><div class="paisBody" id="b-${id}">Contenido de itinerario...</div></div>`;
    }

    function fld(e) { let b = e.nextElementSibling; b.style.display = (b.style.display==="block")?"none":"block"; }

    function toggleC() { let b = document.getElementById('cotB'); b.style.display = (b.style.display==="block")?"none":"block"; }

    function calcM() {
        let eIn = document.getElementById("eurIn").value;
        let vEY = document.getElementById("valEY").value;
        document.getElementById("resEY").innerText = (eIn * vEY).toFixed(2);
        
        let uIn = document.getElementById("uIn").value;
        document.getElementById("oEU").innerText = (uIn / 1.09).toFixed(2);
    }

    function busqueda() {
        let s = document.getElementById("buscador").value.toLowerCase();
        document.querySelectorAll(".paisCard").forEach(c => c.style.display = c.innerText.toLowerCase().includes(s) ? "block" : "none");
    }

    renderSide(); renderAll();
</script>
</body>
</html>
